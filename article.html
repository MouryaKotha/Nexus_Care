<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Article - Nexus Care</title>
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/styles/navigation.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (!localStorage.getItem('nexus_token')) {
            window.location.href = 'login.html';
        }
    </script>
    <style>
        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            z-index: 9999;
            width: 0%;
            transition: width 0.1s ease;
        }

        .article-content h2 {
            font-size: 1.875rem;
            font-weight: 900;
            color: #0f172a;
            margin-top: 3.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .article-content p {
            font-size: 1.125rem;
            color: #334155;
            line-height: 1.8;
            margin-bottom: 1.75rem;
        }
        
        .blog-card {
            background: white;
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1);
        }

        .category-badge {
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
            backdrop-filter: blur(8px);
        }
    </style>
</head>

<body class="with-sidebar bg-slate-50">
    <div id="progressBar"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main id="mainContent" style="margin-left: 260px; transition: margin-left 0.5s cubic-bezier(0.4,0,0.2,1); min-height: 100vh;">
        <div id="articleContainer">
            <!-- Content loaded by article.js -->
        </div>
    </main>

    <script src="src/js/auth.js"></script>
    <script src="src/js/navigation.js"></script>
    <script src="src/js/blog-data.js"></script>
    <script src="src/js/article.js"></script>
</body>

</html>
