                <span></span>

    <div class="mentor-container">
        <header class="mentor-header">
            <h1 class="mentor-title">Your AI Mentor</h1>
            <p class="mentor-subtitle">I'm here to support you with kindness and care.</p>
        </header>

        <div class="chat-window">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will appear here -->
            </div>
            <div class="chat-input-area">
                <button id="micBtn" class="mentor-mic-btn" title="Click to speak"><i class="fas fa-microphone"></i></button>
                <input type="text" id="mentorInput" class="mentor-input" placeholder="Type or speak a message here..."
                    aria-label="Chat input">
                <button id="sendBtn" class="mentor-send-btn">Send</button>
            </div>
        </div>

        <div class="quick-actions">
            <button class="action-btn">
                <i class="fas fa-pills"></i>
                Take Medicine
            </button>
            <button class="action-btn">
                <i class="fas fa-glass-water"></i>
                Drink Water
            </button>
            <button class="action-btn">
                <i class="fas fa-heart"></i>
                I Feel Lonely
            </button>
            <button class="action-btn">
                <i class="fas fa-exclamation-triangle"></i>
                Emergency
            </button>
        </div>
    </div>

    <script src="src/js/navigation.js"></script>
    <script src="src/js/translations.js"></script>
