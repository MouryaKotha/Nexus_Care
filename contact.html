    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6" data-i18n="contact_title">Contact Us</h2>
            <p class="text-center text-gray-600 mb-8" data-i18n="contact_subtitle">We're here to help! Please fill out
                the
                form below to get in touch with us.</p>

            <div id="form-message"
                class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-md mb-6"
                role="alert">
                <p class="text-sm font-medium text-center"></p>
            </div>

            <form id="contact-form" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2"
                        data-i18n="apt_full_name">Full
                        Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        required data-i18n="contact_name_placeholder">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        required>
                </div>
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700 mb-2"
                        data-i18n="contact_subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Appointment Inquiry"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        required data-i18n="contact_subject_placeholder">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-2"
                        data-i18n="contact_message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Please describe your query here..."
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        required data-i18n="contact_message_placeholder"></textarea>
                </div>
                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                        data-i18n="contact_btn_send">
                        Send Message
                    </button>
                </div>
            </form>
        </div>

        <script>
            // The URL of your Google Apps Script deployed as a web app.
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwavsCwBRz58nNSBt7bnrSdiul1IxR-Z3EMTEG3rKM7ppFeE6PXPTGE1NT2qJ9IfZJv/exec';

            const contactForm = document.getElementById('contact-form');
            const formMessage = document.getElementById('form-message');
            const formMessageText = formMessage.querySelector('p');
            const submitButton = contactForm.querySelector('button[type="submit"]');

            contactForm.addEventListener('submit', function (event) {
                event.preventDefault();
                submitButton.disabled = true;
                formMessage.classList.add('hidden');

                const formData = new FormData(contactForm);

                fetch(scriptURL, { method: 'POST', body: formData })
                    .then(response => response.json())
                    .then(data => {
                        if (data.result === 'success') {
                            formMessageText.textContent = 'Thank you for your message! We will get back to you shortly.';
                            formMessage.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700');
                            formMessage.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                            contactForm.reset();
                        } else {
                            throw new Error('Server returned an error.');
                        }
                    })
                    .catch(error => {
                        formMessageText.textContent = 'There was an error sending your message. Please try again.';
                        formMessage.classList.remove('hidden', 'bg-green-100', 'border-green-400', 'text-green-700');
                        formMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                        console.error('Error:', error);
                    })
                    .finally(() => {
                        submitButton.disabled = false;
                    });
            });
        </script>
        <script src="src/js/translations.js"></script>
</body>

</html>
